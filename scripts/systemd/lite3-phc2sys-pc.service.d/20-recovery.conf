[Unit]
# ptp4l owns the continuous Upholds= relationship.  Keep the existing
# Requires=/After= safety ordering in the base unit, but remove start-rate
# limiting so a previously rate-limited phc2sys can recover as soon as the
# validated PTP master becomes active.
StartLimitIntervalSec=0

[Service]
# A clean exit is also unexpected for this long-running clock discipline
# process.  Keep it alive for the entire lifetime of the PC PTP master.
Restart=always
RestartSec=2

