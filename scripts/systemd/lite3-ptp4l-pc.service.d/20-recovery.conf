[Unit]
# Once the PTP master is genuinely active, continuously ensure that the
# CLOCK_REALTIME -> PHC discipline service is active too.  Unlike a one-shot
# Requires= transaction at boot, Upholds= also recovers phc2sys when ptp4l
# becomes ready later (for example after Chrony acquires an upstream source).
Upholds=lite3-phc2sys-pc.service

[Service]
# The original preflight waits up to ten minutes, but systemd's default
# TimeoutStartSec is 90 seconds.  Replace it with a single readiness check and
# let Restart=on-failure/RestartSec=15 retry without blocking boot or timing out.
ExecStartPre=
ExecStartPre=/usr/sbin/ethtool -T enp0s31f6
ExecStartPre=/usr/local/libexec/lite3-ptp-preflight --check-phc
# Require a selected, synchronized Chrony source, but do not confuse WAN NTP
# accuracy with the local PTP accuracy requirement.  The PC<->dog relative
# alignment is provided by hardware PTP; 50 ms here is only an absolute-UTC
# readiness bound and avoids dropping the PTP master on normal WAN jitter.
ExecStartPre=/usr/bin/chronyc waitsync 1 0.050 0.0 0
TimeoutStartSec=15

