%YAML:1.0

File.version: "1.0"

Camera.type: "PinHole"

Camera1.fx: 604.0978393554688
Camera1.fy: 603.3976440429688
Camera1.cx: 323.78936767578125
Camera1.cy: 252.87355041503906

# 当前输入已经是校正并对齐到color的数据
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0
Camera1.k3: 0.0

Camera.width: 640
Camera.height: 480
Camera.newWidth: 640
Camera.newHeight: 480
Camera.fps: 15

# 导出脚本将rgb8转换成OpenCV读取的BGR顺序
Camera.RGB: 0

# D435/D435i深度双目基线，单位m
Stereo.b: 0.050

# 近点/远点分类阈值约为 baseline * ThDepth = 2m
Stereo.ThDepth: 40.0

# 深度PNG单位为毫米：depth_m = raw_depth / 1000
RGBD.DepthMapFactor: 1000.0

ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
