/rtabmap/rtabmap:
  ros__parameters:
    ############################
    # ROS接口参数
    ############################
    frame_id: "base_link"          # 机器人基座坐标系
    odom_frame_id: "odom"          # 非空：通过TF获取里程计
    map_frame_id: "map"             # 全局地图坐标系
    publish_tf: true                # 开启 map → odom TF发布
    subscribe_rgb: true             # 订阅RGB图像
    subscribe_depth: true           # 订阅深度图像
    subscribe_rgbd: false            # 不订阅预同步RGBD消息
    subscribe_imu: true              # 接收IMU，用于图优化中的重力约束
    approx_sync: true               # 使用近似时间同步
    sync_queue_size: 10             # 消息同步队列大小

    ############################
    # 数据库
    ############################
    database_path: "/home/ruming/ros2_ws/src/rtabmap_robot/db/lite3_live.db"
    delete_db_on_start: true         # 每次启动清空同一路径的旧地图

    # 视觉特征与配准
    ############################
    Vis/MinInliers: "15"             # 视觉匹配最少内点数量
    Kp/DetectorStrategy: "6"         # 特征检测策略：6=GFTT/BRIEF

    ############################
    # RGB-D SLAM
    ############################
    RGBD/NeighborLinkRefining: "true"  # 优化相邻关键帧约束
    RGBD/ProximityBySpace: "true"      # 开启空间近邻检测

    ############################
    # 回环检测与内存管理
    ############################
    Mem/IncrementalMemory: "true"     # 增量建图模式
    Mem/InitWMWithAllNodes: "false"   # 不将全部历史节点载入工作记忆

    ############################
    # 图优化
    ############################
    RGBD/OptimizeFromGraphEnd: "false" # 不从图末端开始优化

    ############################
    # 栅格建图
    ############################
    Grid/Sensor: "1"                  # 使用深度图生成栅格
    Grid/CellSize: "0.05"             # 栅格分辨率：5cm
    Grid/RangeMax: "5.0"               # 最大建图距离：5m

    ############################
    # 配准与近邻检测
    ############################
    RGBD/ProximityPathMaxNeighbors: "0" # 禁用基于局部路径的多对一近邻检测
    Reg/Strategy: "0"                  # 配准策略：0=视觉


/rtabmap/rgbd_odometry:
  ros__parameters:
    ############################
    # 视觉里程计接口
    ############################
    frame_id: "base_link"             # 机器人基座坐标系
    odom_frame_id: "odom"             # 视觉里程计坐标系
    publish_tf: true                  # 开启 odom → base_link TF发布

    ############################
    # 视觉里程计参数
    ############################
    Odom/Strategy: "0"                # 里程计策略：0=帧到地图
    Vis/MinInliers: "15"              # 视觉匹配最少内点数量
    Kp/DetectorStrategy: "6"          # 特征检测策略：6=GFTT/BRIEF
