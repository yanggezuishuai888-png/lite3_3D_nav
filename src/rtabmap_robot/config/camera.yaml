camera:
  ros__parameters:

    # OpenLORIS D400 RGB图像
    rgb_topic: "/d400/color/image_raw"

    # 已对齐到彩色相机的深度图
    depth_topic: "/d400/aligned_depth_to_color/image_raw"

    # 由 camera_info_republisher 按 RGB 时间戳重发的内参
    camera_info_topic: "/openloris/color/camera_info"


    # 机器人基座；base_link -> d400_color 静态TF来自bag
    frame_id: "base_link"


    # 时间同步
    approx_sync: true

    # RGB与对齐深度的近似同步最大时间差（秒）
    approx_sync_max_interval: 0.02

    # 同步队列大小
    queue_size: 10


    # 使用RGB-D输入
    subscribe_rgb: true

    subscribe_depth: true

    subscribe_rgbd: false


    # OpenLORIS深度图已对齐到彩色图
    depth_aligned: true
